script = "nowaiver.sh"
plant_file = "src/ui/list.rs"
plant_find = "//! The row grammar: every function here is a pure total transformation,"
# The forbidden phrase itself is written with the %%DASHDASH%% placeholder (expanded to
# "--" only when the harness applies the plant) so that THIS FILE, swept by nowaiver.sh's
# own extension-less "Makefile .github/workflows src tests" search, does not trip the very
# gate it is testing before the plant is ever applied.
plant_replace = '''//! The row grammar: every function here is a pure total transformation,
// %%DASHDASH%%ignore-filename-regex used here'''
expect = "NOWAIVER FAIL: a coverage waiver entered the tree"
why = "a coverage-waiver phrase anywhere under src/ must fail the waiver sweep"

