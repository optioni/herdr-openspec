why = "task 9.3 (CRITICAL 2): scripts/coverage-prod.py reads a PROD_MIN environment override with no floor of its own - a PROD_MIN=0 prefix on the Makefile's coverage-prod.py line would silence the production floor entirely while make check, make gates, and every other control stayed green"
