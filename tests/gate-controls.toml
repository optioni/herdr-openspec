# The executable positive-control map for every script under scripts/gates/.
#
# See openspec/changes/gate-integrity/design.md -> Test Strategy and -> Decision 6/6a, and
# openspec/changes/gate-integrity/specs/quality-gates/spec.md -> "Every gate's positive
# control is executed, not attested". tests/gate_controls.rs is what runs this table: for
# every [[control]] it copies the repository tree to a scratch directory, asserts the named
# gate script exits 0 UNPLANTED, applies the recorded plant, and asserts the gate now exits
# non-zero and its own output names `expect`.
#
# This is the outer-loop acceptance test for the whole gate-integrity change. At the time
# this file was first written (task group 0), five of these entries are known to FAIL —
# the gate they name still reports success on the exact defect it exists to catch. That is
# the change's own starting RED, and groups 2-5 repair the named scripts to turn each GREEN
# without touching this file's plants. Nothing here should ever be loosened to make a
# failure disappear; a script gets fixed, not a control.
#
# Field reference, one [[control]] per row:
#   id             a short, unique label for this control (distinct even when several
#                  entries share the same `script`, as scripts/gates/wired.sh does here)
#   script         the file name under scripts/gates/ this control exercises
#   interpreter    "sh" (default) or "python3" — how the script is invoked
#   env            the invocation prefix the `gates:` recipe uses for this subject, written
#                  exactly as it appears on that Makefile line (e.g. "env -u GRAPH_WRITE",
#                  "SCAN_MIN=135"), or empty for a bare invocation
#   needs_git      true when the scratch copy must be `git init && git add -A && git
#                  commit`-ed before the baseline run — openspec-untouched.sh only
#                  (design.md -> Decision 6a)
#   cargo          true for the two gates that invoke cargo (deps.sh, build-graph.sh) — the
#                  scratch run is pointed at the real target/ via CARGO_TARGET_DIR, measured
#                  at implementation time to cost well under a second per run and therefore
#                  NOT marked #[ignore] (design.md -> Decision 6a's contingency)
#   plant_kind     "edit" (default; find/replace inside an existing file) or "create" (write
#                  a brand-new file — openspec-untouched.sh's untracked-file plant only)
#   plant_file     path, relative to the repository root, the plant is applied to
#   plant_find     (edit only) the exact substring located and replaced — its absence is a
#                  harness error, distinct from the gate not catching the plant
#   plant_replace  (edit only) what replaces plant_find; empty for a pure deletion
#   plant_content  (create only) the new file's contents
#   expect         a fragment of the gate script's own FAIL: message — chosen from what the
#                  script itself would print if it caught the plant, per design.md -> Risks
#                  ("chosen from each script's own FAIL: message ... rather than from grep's
#                  or awk's output")
#   why            one line recording what the plant demonstrates

[[control]]
id = "agentseam-spawn"
script = "agentseam.sh"
plant_file = "src/agents.rs"
plant_find = "//! The Herdr agent poller: the crate's second worker thread. Confined to this one"
plant_replace = '''//! The Herdr agent poller: the crate's second worker thread. Confined to this one
use std::process::Command as PlantedAgentSeamCommand;'''
expect = "AGENTSEAM FAIL (leg 1)"
why = "a spawn API named directly in src/agents.rs must fail leg 1's file-scoped restatement of NOSPAWN-GREP"

[[control]]
id = "build-graph-snapshot"
script = "build-graph.sh"
env = "env -u GRAPH_WRITE"
cargo = true
plant_file = "tests/fixtures/build-graph.txt"
plant_find = "## aarch64-apple-darwin"
plant_replace = "## aarch64-apple-darwin\nplanted-bogus-package v0.0.0"
expect = "GRAPH-SNAP FAIL: graph differs from the snapshot"
why = "a package the real resolution never produced must fail the snapshot diff"

[[control]]
id = "deps-features"
script = "deps.sh"
cargo = true
plant_file = "Cargo.toml"
plant_find = 'toml = { version = "1.1.5", default-features = false, features = ["std", "parse", "display", "serde"] }'
plant_replace = 'toml = { version = "1.1.5", default-features = false, features = ["parse", "display", "serde"] }'
expect = "DEPS FAIL: leg 2a"
why = "dropping a declared feature from the manifest must fail leg 2a's exact-features assertion"

