verdict = "confirmed"
why = "three proofs for the row's two halves, plus the S10 shim shape folded in rather than given a third row of its own: a_failed_cli_cycle_keeps_the_file_numbers (outer) runs a real run_wired cycle against a scratch openspec exiting non-zero and shows the file-sourced numbers survive; an_exec_failure_of_the_openspec_shim_reports_its_own_stderr (unit) feeds cli_error_problem the measured Failed{code:127} shape and shows the stderr line is carried; a_shim_whose_interpreter_is_unreachable_exits_127_and_renders_a_problem_row (unit, real worker thread) drives the same worker::worker_for_test seam group 9 already exercises with a Failed{code:127} openspec answer, and shows the file-sourced set survives with the problem recorded — group 9 deliberately folded the shim's unreachable-interpreter case into this existing row rather than adding a third, since a 127 exit is a 127 exit regardless of why the child never execed. The outer proof is the strongest of the three, since it exercises the real cycle rather than calling cli_error_problem or the worker directly. tier is \"unit\" because tests/degraded_coverage.rs applies its view/outer rendering check per proof entry, and neither unit proof's own body renders anything through a TestBackend"
covers = ["src/changes.rs:1566-1573", "src/changes.rs:1341-1356"]

