why = "the launcher's worker is driven through `handle` against a HerdrCli whose `integration status` fails, and separately against one whose output parses to nothing; the first proves a configured kind still reaches `--kind` with exactly one problem and no second one claiming its integration is absent, the second proves the last resort with the read failure first, and the third proves the per-line problems are summarised into one entry at the launch boundary - three lines and seventeen both yielding two, while `parse` itself still returns one per line"
