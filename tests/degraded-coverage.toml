# The executable coverage map SPEC.md's "## Degraded states" table is bound to.
# See openspec/changes/degraded-states/specs/degraded-coverage/spec.md for the full
# contract, and openspec/changes/degraded-states/notes/audit.md for the narrative audit
# each verdict and "why" here summarises.

[[row]]
condition = "No `openspec/` found while walking up"
tier = "view"
proof = ["no_repository_names_the_directory_searched"]
verdict = "confirmed"
why = "the list region renders the empty state naming the directory searched, via render_at"
covers = ["src/ui/list.rs:217-226"]

[[row]]
condition = "`openspec` binary not found"
tier = "view"
proof = ["file_mode_badge_is_dim_after_the_label", "badge_drops_whole_below_eighteen_columns"]
verdict = "implemented"
why = "the header renders a dim file mode badge, driven through render_at at both widths"
covers = ["src/ui/view.rs:227-234"]

[[row]]
condition = "Schema unknown to the CLI"
tier = "unit"
proof = ["a_cli_rejected_schema_names_its_reason_per_change"]
verdict = "unproven"
why = "a real FakeCli-driven from_cli merge falls back per change and content_lines renders the reason"
covers = ["src/changes.rs:1338-1380"]

[[row]]
condition = "Schema not vendored (no `openspec/schemas/<name>/schema.yaml` locally)"
tier = "unit"
proof = ["an_unusable_schema_renders_no_artifacts"]
verdict = "unproven"
why = "a real not-vendored schema, read through changes::from_files, empties tab_bar"
covers = ["src/changes.rs:938-940"]

[[row]]
condition = "Schema unreadable or invalid (I/O error, or bytes that are not a usable schema)"
tier = "unit"
proof = ["an_unusable_schema_renders_no_artifacts"]
verdict = "unproven"
why = "a real unparseable schema.yaml, read through changes::from_files, empties tab_bar"
covers = ["src/changes.rs:941-946"]

[[row]]
condition = "Schema loads with no tasks artifact (`apply.tracks` matches nothing, and no artifact has id `tasks`)"
tier = "unit"
proof = ["no_tasks_artifact_renders_every_tab_as_markdown"]
verdict = "unproven"
why = "every tab dispatches to markdown, never the checklist grammar, and progress falls back to tasks.md"
covers = ["src/changes.rs:751-753"]

[[row]]
condition = "No active changes"
tier = "view"
proof = ["a_repository_with_no_changes_says_so"]
