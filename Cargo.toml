[package]
name = "herdr-openspec"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
toml = { version = "1.1.5", default-features = false, features = ["std", "parse", "display", "serde"] }
yaml-rust2 = { version = "0.12.0", default-features = false, features = [] }
serde_json = { version = "1.0.151", default-features = false, features = ["std"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
pulldown-cmark = { version = "0.13.4", default-features = false, features = [] }
notify = { version = "8.2.0", default-features = false, features = ["macos_fsevent"] }

[dev-dependencies]
